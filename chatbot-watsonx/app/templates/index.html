<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot — watsonx AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 820px;
      overflow: hidden;
    }

    .chat-header {
      background: #1d3557;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
    }

    .chat-header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .chat-header span {
      font-size: 12px;
      opacity: 0.7;
      margin-left: auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #1d3557;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      background: #f1f5f9;
      color: #1f2328;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
      align-self: flex-start;
      font-size: 13px;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: #f1f5f9;
      border-radius: 10px;
      border-bottom-left-radius: 3px;
      padding: 12px 16px;
      gap: 5px;
      align-items: center;
    }

    .typing-indicator.visible { display: flex; }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      background: #ffffff;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #1d3557; }

    #send-btn {
      background: #1d3557;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    #send-btn:hover:not(:disabled) { background: #274472; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="dot"></div>
      <h1>Assistente watsonx AI</h1>
      <span>openai/gpt-oss-120b</span>
    </div>

    <div class="messages" id="messages">
      <div class="message assistant">Ciao! Sono il tuo assistente powered by IBM watsonx AI. Come posso aiutarti?</div>
      <div class="typing-indicator" id="typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Scrivi un messaggio… (Invio per inviare, Shift+Invio per andare a capo)"
      ></textarea>
      <button id="send-btn">Invia</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const typingEl   = document.getElementById('typing');

    // Cronologia della conversazione (escluso il messaggio di benvenuto iniziale)
    const history = [];

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      messagesEl.insertBefore(div, typingEl);
      scrollToBottom();
    }

    function setLoading(active) {
      typingEl.classList.toggle('visible', active);
      sendBtn.disabled = active;
      inputEl.disabled = active;
      scrollToBottom();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      setLoading(true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Errore sconosciuto');
        }

        const data = await res.json();
        history.push({ role: 'assistant', content: data.reply });
        addMessage('assistant', data.reply);
      } catch (err) {
        addMessage('error', `Errore: ${err.message}`);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
