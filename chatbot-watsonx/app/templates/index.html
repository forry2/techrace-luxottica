<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordini — watsonx AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .layout {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      align-items: start;
    }

    /* ── Pannello sinistro ──────────────────────────── */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      background: #1d3557;
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .card-header .badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .card-body {
      padding: 18px;
    }

    /* ── Tabella ordini ─────────────────────────────── */
    .orders-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 2px solid #e5e7eb;
      color: #57606a;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f7f8fa; }

    tbody td {
      padding: 9px 10px;
      color: #1f2328;
      vertical-align: top;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-draft      { background: #fef9c3; color: #713f12; }
    .status-confirmed  { background: #dcfce7; color: #14532d; }
    .status-cancelled  { background: #fee2e2; color: #7f1d1d; }

    .order-lines-cell { color: #57606a; font-size: 12px; }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: #57606a;
      font-size: 14px;
    }

    /* ── Modulo ordine ──────────────────────────────── */
    .form-grid {
      display: grid;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    input[type="text"], input[type="number"], select {
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus { border-color: #1d3557; }

    .lines-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lines-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lines-header label { margin: 0; }

    .order-line-row {
      display: grid;
      grid-template-columns: 1fr 90px 32px;
      gap: 8px;
      align-items: center;
    }

    .btn-icon {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-icon:hover { background: #fecaca; }

    .btn-secondary {
      background: #f1f5f9;
      color: #1d3557;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: #e2e8f0; }

    .btn-primary {
      background: #1d3557;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) { background: #274472; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
    }

    .alert.success { background: #dcfce7; color: #14532d; display: block; }
    .alert.error   { background: #fee2e2; color: #7f1d1d; display: block; }

    /* ── Chat ───────────────────────────────────────── */
    .chat-container {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 820px;
      position: sticky;
      top: 20px;
      overflow: hidden;
    }

    .chat-header {
      background: #1d3557;
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-header .dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chat-header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .chat-header span {
      font-size: 11px;
      opacity: 0.7;
      margin-left: auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #1d3557;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      background: #f1f5f9;
      color: #1f2328;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
      align-self: flex-start;
      font-size: 12px;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: #f1f5f9;
      border-radius: 10px;
      border-bottom-left-radius: 3px;
      padding: 11px 14px;
      gap: 5px;
      align-items: center;
    }

    .typing-indicator.visible { display: flex; }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 12px 14px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 9px;
      background: #ffffff;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      line-height: 1.5;
      max-height: 100px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #1d3557; }

    #send-btn {
      background: #1d3557;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    #send-btn:hover:not(:disabled) { background: #274472; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .chat-container { height: 60vh; position: static; }
    }
  </style>
</head>
<body>
  <div class="layout">

    <!-- ── Pannello sinistro: lista + modulo ───────── -->
    <div class="left-panel">

      <!-- Lista ordini -->
      <div class="card">
        <div class="card-header">
          <h2>Ordini</h2>
          <span class="badge" id="orders-count">0</span>
        </div>
        <div class="card-body">
          <div class="orders-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Cliente</th>
                  <th>Righe</th>
                  <th>Stato</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="orders-tbody">
                <tr><td colspan="5" class="empty-state">Caricamento…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modulo nuovo ordine -->
      <div class="card">
        <div class="card-header">
          <h2>Nuovo ordine</h2>
        </div>
        <div class="card-body">
          <div class="form-grid">

            <div class="form-group">
              <label for="customer-name">Nome cliente</label>
              <input type="text" id="customer-name" placeholder="es. Mario Rossi" autocomplete="off" />
            </div>

            <div class="lines-section">
              <div class="lines-header">
                <label>Righe ordine</label>
                <button class="btn-secondary" id="add-line-btn" type="button">+ Aggiungi riga</button>
              </div>
              <div id="order-lines">
                <!-- righe dinamiche -->
              </div>
            </div>

            <div id="form-alert" class="alert"></div>

            <div class="form-actions">
              <button class="btn-primary" id="submit-order-btn" type="button">Crea ordine</button>
            </div>

          </div>
        </div>
      </div>

    </div>

    <!-- ── Chat ───────────────────────────────────── -->
    <div class="chat-container">
      <div class="chat-header">
        <div class="dot"></div>
        <h2>Assistente watsonx AI</h2>
        <span>openai/gpt-oss-120b</span>
      </div>

      <div class="messages" id="messages">
        <div class="message assistant">Ciao! Sono il tuo assistente powered by IBM watsonx AI. Posso aiutarti a gestire gli ordini o rispondere a qualsiasi domanda.</div>
        <div class="typing-indicator" id="typing">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="input-area">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Scrivi un messaggio… (Invio per inviare)"
        ></textarea>
        <button id="send-btn">Invia</button>
      </div>
    </div>

  </div>

  <script>
    // ── SKU disponibili ──────────────────────────────────────────────────────
    const AVAILABLE_SKUS = ['WIDGET-1', 'WIDGET-2', 'PALLET-BOX'];

    // ── Lista ordini ─────────────────────────────────────────────────────────
    async function loadOrders() {
      try {
        const res = await fetch('/orders');
        if (!res.ok) throw new Error('Errore caricamento ordini');
        const orders = await res.json();
        renderOrders(orders);
      } catch (e) {
        document.getElementById('orders-tbody').innerHTML =
          `<tr><td colspan="5" class="empty-state" style="color:#b91c1c">${e.message}</td></tr>`;
      }
    }

    function statusBadge(status) {
      const cls = { DRAFT: 'status-draft', CONFIRMED: 'status-confirmed', CANCELLED: 'status-cancelled' };
      return `<span class="status-badge ${cls[status] || ''}">${status}</span>`;
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('orders-tbody');
      document.getElementById('orders-count').textContent = orders.length;
      if (!orders.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nessun ordine presente</td></tr>';
        return;
      }
      tbody.innerHTML = orders.map(o => {
        const linesText = (o.lines || [])
          .map(l => `${l.sku} ×${l.quantity}`)
          .join(', ') || '—';
        const date = o.created_at ? o.created_at.slice(0, 16).replace('T', ' ') : '—';
        return `<tr>
          <td><strong>#${o.id}</strong></td>
          <td>${escapeHtml(o.customer_name)}</td>
          <td class="order-lines-cell">${escapeHtml(linesText)}</td>
          <td>${statusBadge(o.status)}</td>
          <td style="white-space:nowrap;color:#57606a;font-size:12px">${date}</td>
        </tr>`;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Modulo ordine ────────────────────────────────────────────────────────
    let lineCount = 0;

    function addLine(sku = '', qty = 1) {
      lineCount++;
      const id = `line-${lineCount}`;
      const container = document.getElementById('order-lines');
      const row = document.createElement('div');
      row.className = 'order-line-row';
      row.id = id;
      row.innerHTML = `
        <select data-field="sku">
          ${AVAILABLE_SKUS.map(s => `<option value="${s}"${s === sku ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
        <input type="number" data-field="qty" min="1" max="9999" value="${qty}" placeholder="Qtà" />
        <button class="btn-icon" type="button" onclick="removeLine('${id}')" title="Rimuovi riga">×</button>
      `;
      container.appendChild(row);
    }

    function removeLine(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function getLines() {
      const rows = document.querySelectorAll('#order-lines .order-line-row');
      return Array.from(rows).map(row => ({
        sku:      row.querySelector('[data-field="sku"]').value,
        quantity: parseInt(row.querySelector('[data-field="qty"]').value, 10) || 1,
      }));
    }

    function showAlert(type, msg) {
      const el = document.getElementById('form-alert');
      el.className = `alert ${type}`;
      el.textContent = msg;
      setTimeout(() => { el.className = 'alert'; el.textContent = ''; }, 4000);
    }

    // ── Popolamento form dai dati strutturati restituiti dal backend ──────────
    function applyFormData(formData) {
      if (!formData) return;
      if (formData.customer_name) {
        document.getElementById('customer-name').value = formData.customer_name;
      }
      if (Array.isArray(formData.lines) && formData.lines.length > 0) {
        document.getElementById('order-lines').innerHTML = '';
        lineCount = 0;
        formData.lines.forEach(l => addLine(l.sku, l.quantity));
      }
      if (formData.customer_name || (formData.lines && formData.lines.length > 0)) {
        showAlert('success', 'Form compilato dall\'AI. Verifica e clicca "Crea ordine".');
      }
    }

    document.getElementById('add-line-btn').addEventListener('click', () => addLine());

    document.getElementById('submit-order-btn').addEventListener('click', async () => {
      const customerName = document.getElementById('customer-name').value.trim();
      if (!customerName) { showAlert('error', 'Inserisci il nome del cliente.'); return; }
      const lines = getLines();
      if (!lines.length) { showAlert('error', 'Aggiungi almeno una riga ordine.'); return; }

      const btn = document.getElementById('submit-order-btn');
      btn.disabled = true;
      btn.textContent = 'Creazione…';

      try {
        const res = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_name: customerName, lines }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Errore sconosciuto');
        }
        const order = await res.json();
        showAlert('success', `Ordine #${order.id} creato con successo!`);
        document.getElementById('customer-name').value = '';
        document.getElementById('order-lines').innerHTML = '';
        lineCount = 0;
        addLine();
        await loadOrders();
      } catch (e) {
        showAlert('error', `Errore: ${e.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crea ordine';
      }
    });

    // Riga iniziale nel modulo
    addLine();

    // Carica ordini all'avvio
    loadOrders();

    // ── Chat watsonx ─────────────────────────────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const typingEl   = document.getElementById('typing');
    const history    = [];

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      messagesEl.insertBefore(div, typingEl);
      scrollToBottom();
    }

    function setLoading(active) {
      typingEl.classList.toggle('visible', active);
      sendBtn.disabled = active;
      inputEl.disabled = active;
      scrollToBottom();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      setLoading(true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Errore sconosciuto');
        }

        const data = await res.json();
        history.push({ role: 'assistant', content: data.reply });
        addMessage('assistant', data.reply);
        applyFormData(data.form_data);
      } catch (err) {
        addMessage('error', `Errore: ${err.message}`);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });
  </script>
</body>
</html>
